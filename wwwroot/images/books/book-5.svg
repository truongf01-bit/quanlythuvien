<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="spineGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.55)" />
      <stop offset="35%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="70%" stop-color="rgba(0,0,0,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)" />
    </linearGradient>
  </defs>

  <rect width="400" height="560" rx="10" fill="url(#bgGrad5)" />

  <!-- Background decorative geometric accents -->
  <circle cx="350" cy="80" r="130" fill="#c084fc" opacity="0.08" />
  <circle cx="50" cy="460" r="150" fill="#c084fc" opacity="0.06" />
  <rect x="240" y="190" width="160" height="160" rx="20" transform="rotate(25 240 190)" fill="#c084fc" opacity="0.04" />

  <!-- 3D book spine on left -->
  <rect x="0" y="0" width="28" height="560" rx="4" fill="url(#spineGrad5)" />
  <line x1="28" y1="0" x2="28" y2="560" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Elegant inner border -->
  <rect x="42" y="24" width="334" height="512" rx="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />

  <!-- Category badge -->
  <rect x="52" y="38" width="210" height="26" rx="4" fill="#c084fc" opacity="0.2" />
  <text x="60" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c084fc" letter-spacing="1">CÔNG NGHỆ THÔNG TIN</text>

  <!-- Icon stamp -->
  <g transform="translate(315, 34)">
    <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.08)" stroke="#c084fc" stroke-width="1" />
    <text x="16" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="800" fill="#c084fc" text-anchor="middle">AI</text>
  </g>

  <line x1="52" y1="78" x2="360" y2="78" stroke="#c084fc" stroke-width="2" opacity="0.5" />

  <!-- Book Title -->
  <text x="52" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
    Nhập Môn Trí Tuệ Nhân Tạo
  </text>

  <!-- Subtitle -->
  <text x="52" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgba(255,255,255,0.85)">
    Machine Learning & Deep Learning
  </text>

  <!-- Center emblem -->
  <g transform="translate(52, 215)">
    <rect width="296" height="175" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <path d="M 60,95 Q 110,80 148,100 Q 186,80 236,95 L 236,135 Q 186,120 148,140 Q 110,120 60,135 Z" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <line x1="148" y1="100" x2="148" y2="140" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="148" cy="60" r="18" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7" />
    <text x="148" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">★</text>
    <text x="148" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1.5">GIÁO TRÌNH HỌC THUẬT</text>
  </g>

  <!-- Author Info -->
  <g transform="translate(52, 420)">
    <text x="0" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">TÁC GIẢ</text>
    <text x="0" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">TS. Đỗ Quang Vinh</text>
  </g>

  <!-- Footer / Publisher -->
  <line x1="52" y1="480" x2="360" y2="480" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="206" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="1">
    NXB TRẺ
  </text>
</svg>